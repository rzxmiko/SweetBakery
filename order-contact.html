<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <title>Sweet Bakery - Order &amp; Contact</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">Sweet<span>Bakery</span></a>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="promotions.html">Promotions</a>
                <a href="cakes-catalog.html">Cakes Catalog</a>
                <a href="desserts-menu.html">Desserts Menu</a>
                <a href="about.html">About Us</a>
                <a href="order-contact.html" class="active">Order &amp; Contact</a>
            </nav>
        </div>
    </header>

    <section class="page-hero">
        <div class="page-hero-inner">
            <h1>Order a cake &amp; contact us</h1>
            <p>Tell us what you have in mind and we'll get back to you with a quote.</p>
        </div>
    </section>

    <main>
        <section id="order-section">
            <h2>Order Form</h2>
            <form id="contact-form" action="#" method="post">
                <label>Name: <input type="text" Enter your name name="name" required></label><br><br>
                <label>Email: <input type="email" Enter your email name="email" required></label><br><br>
                <label>Cake Color: <input type="color" name="color" value="#ffb6c1"></label><br><br>
                <label>Special Requests:<br><textarea name="message" rows="4" required></textarea></label><br><br>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>

        <section id="contacts-section">
            <h2>Contacts</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2505.378776856515!2d71.4162012!3d51.0908489!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x424585a605555555%3A0x123456789abcdef!2sAstana%20IT%20University!5e0!3m2!1sru!2skz!4v1600000000000" width="100%" height="200" style="border:0;"></iframe>
        </section>
    </main>

    <footer>
        <p>Created by: Shamelova Dilara, Yessendos Diana, Shyntemir Zhanbota (SE-2506)</p>
    </footer>
</body>
